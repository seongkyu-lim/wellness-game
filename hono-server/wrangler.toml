# Cloudflare Workers 설정. 배포는 `npm run deploy`(사람이 확인 후 실행). 비밀값은 `wrangler secret put` 으로 넣고 여기 적지 않는다.
name = "wellness-game-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# postgres(porsager)·bcryptjs 가 node:net·crypto 호환 API 를 쓴다
compatibility_flags = ["nodejs_compat"]

# 아래 OAUTH_APPLE_REQUIRE_NONCE·AUTH_JWT_LEGACY_CUTOFF 는 운영 Spring(render.yaml)과 같은 값이다.
[vars]
APP_TIMEZONE = "Asia/Seoul"
APP_API_DOCS_ENABLED = "false"
CORS_ALLOWED_ORIGINS = "http://localhost:5173"
OAUTH_APPLE_REQUIRE_NONCE = "true"
AUTH_JWT_LEGACY_CUTOFF = ""

# Supabase Postgres 앞의 Hyperdrive(연결 풀). 반드시 쿼리 캐시를 끈 설정을 쓴다:
#   wrangler hyperdrive create wellness-db --caching-disabled --connection-string="postgres://...?sslmode=require"
# 캐시가 켜져 있으면 토큰 무효화 기준·리프레시 토큰·로그인 실패 뒤 계정·방금 쓴 활동 기록을 읽는 SELECT 가 오래된 결과를
# 받을 수 있다(로그아웃한 토큰 통과, 동기화 직후 조회 누락). 모든 쿼리에 바인딩 하나를 쓴다(README "Hyperdrive").
# id 는 위 명령이 만든 값으로 바꾼다. 로컬 `wrangler dev` 는 localConnectionString 을 쓴다.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000000000000000000000000000"
localConnectionString = "postgres://wellness:wellness@localhost:5432/wellness_game"

# 만료·폐기 리프레시 토큰 정리: 매일 04:00 KST(= 19:00 UTC). Spring RefreshTokenCleanupJob 과 같다.
[triggers]
crons = ["0 19 * * *"]

[observability]
enabled = true
