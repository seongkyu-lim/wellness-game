services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: wellness_game
      POSTGRES_USER: wellness
      POSTGRES_PASSWORD: wellness
    ports:
      - "15432:5432"
    volumes:
      - wellness-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellness -d wellness_game"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/wellness_game
      DATABASE_USERNAME: wellness
      DATABASE_PASSWORD: wellness
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
      # 필수. 32바이트 이상 비밀키를 환경변수 또는 .env 로 주입 (예: openssl rand -base64 48)
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET 환경변수를 설정하세요 (32바이트 이상)}
      OAUTH_GOOGLE_IOS_CLIENT_ID: ${OAUTH_GOOGLE_IOS_CLIENT_ID:-}
      OAUTH_KAKAO_NATIVE_APP_ID: ${OAUTH_KAKAO_NATIVE_APP_ID:-}
      OAUTH_APPLE_BUNDLE_ID: ${OAUTH_APPLE_BUNDLE_ID:-}
      OAUTH_APPLE_REQUIRE_NONCE: ${OAUTH_APPLE_REQUIRE_NONCE:-false}
      # Auth v2: 액세스 1시간, 리프레시 30일, Watch 조회 토큰 12시간(기본값과 같음)
      # 배포 1단계: 구버전 앱 호환을 위해 30d로 시작, 새 클라이언트 보급 후 1h로 낮춤(README 인증 세션 절)
      AUTH_JWT_TTL: ${AUTH_JWT_TTL:-30d}
      AUTH_REFRESH_TTL: ${AUTH_REFRESH_TTL:-30d}
      AUTH_WATCH_TOKEN_TTL: ${AUTH_WATCH_TOKEN_TTL:-7d}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  wellness-postgres:
