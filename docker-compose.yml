services:
  mysql:
    image: mysql:8.4.10
    environment:
      MYSQL_DATABASE: wellness_game
      MYSQL_USER: wellness
      MYSQL_PASSWORD: wellness
      MYSQL_ROOT_PASSWORD: wellness-root
    ports:
      - "13306:3306"
    volumes:
      - wellness-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u wellness -pwellness --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/wellness_game?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USERNAME: wellness
      DATABASE_PASSWORD: wellness
      # 로컬 개발용 기본 키. 운영에서는 반드시 AUTH_JWT_SECRET 환경변수로 32바이트 이상 비밀키를 주입할 것.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-dev-only-secret-change-me-0123456789}
      OAUTH_GOOGLE_IOS_CLIENT_ID: ${OAUTH_GOOGLE_IOS_CLIENT_ID:-}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  wellness-mysql:
