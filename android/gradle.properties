org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- 앱 설정(빈 값이면 해당 로그인 버튼이 비활성화된다) ----
# 실제 키는 저장소에 커밋하지 말고 ~/.gradle/gradle.properties 나 -P 옵션으로 넣는다.
# release 서버 주소(https만 허용). debug 빌드는 항상 http://10.0.2.2:8080 을 쓴다.
API_BASE_URL=https://api.wellnessgame.example
# Google 로그인: 서버가 검증하는 웹 OAuth 클라이언트 ID(Credential Manager serverClientId)
GOOGLE_SERVER_CLIENT_ID=
KAKAO_NATIVE_APP_KEY=
NAVER_CLIENT_ID=
NAVER_CLIENT_SECRET=
NAVER_CLIENT_NAME=
