<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>레벨업 연출</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFE066}a:hover{color:#FFFFFF}
@keyframes pop{0%{transform:scale(.6) translateY(30px)}60%{transform:scale(1.08) translateY(-6px)}80%{transform:scale(.97)}100%{transform:scale(1)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{transform:scale(.5) rotate(0deg);opacity:.4}50%{transform:scale(1.15) rotate(30deg);opacity:1}}
@keyframes shake{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(-2deg) scale(1.04)}}
.pop{animation:pop 1.1s cubic-bezier(.2,1.4,.4,1) both}
.spin{animation:spin 18s linear infinite}
.tw{animation:twinkle 1.6s ease-in-out infinite}
.tw2{animation:twinkle 2.1s ease-in-out .5s infinite}
.tw3{animation:twinkle 1.9s ease-in-out 1s infinite}
.shake{animation:shake 1.4s ease-in-out infinite}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: 'Jua', sans-serif; color: #FFFFFF; background-color: #1F2340; background-image: repeating-conic-gradient(from 0deg at 50% 40%, {{burst}} 0deg 3deg, #1F2340 3deg 11deg)">

  <div class="spin" style="position: absolute; left: 50%; top: 40%; width: 420px; height: 420px; margin: -210px 0 0 -210px; border-radius: 50%; background-image: radial-gradient(circle, rgba(255,240,170,0.95) 0 28%, rgba(255,240,170,0.35) 29% 40%, transparent 41%)"></div>

  <div style="position: absolute; left: 0; right: 0; top: 56px; display: flex; flex-direction: column; align-items: center; gap: 6px">
    <span style="font-size: 18px; color: #FFE066; letter-spacing: 2px">새싹이가 성장했어요</span>
    <h1 class="shake" style="margin: 0; font-family: 'Black Han Sans', sans-serif; font-weight: 400; font-size: 66px; line-height: 1; color: #FFE066; text-shadow: 5px 5px 0 #FF6FA5">LEVEL UP!</h1>
    <div style="display: flex; align-items: center; gap: 10px; margin-top: 8px">
      <span style="background-color: #FFFFFF; color: #1F2340; border: 3px solid #1F2340; border-radius: 999px; padding: 3px 12px; font-size: 17px">Lv.9</span>
      <svg width="28" height="20" viewBox="0 0 28 20" aria-hidden="true"><path d="M2 10 H22 M15 3 L24 10 L15 17" fill="none" stroke="#FFE066" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="background-color: #FFE066; color: #1F2340; border: 3px solid #1F2340; border-radius: 999px; padding: 3px 14px; font-family: 'Black Han Sans', sans-serif; font-size: 20px">Lv.10</span>
    </div>
  </div>

  <svg class="tw" style="position: absolute; left: 44px; top: 250px" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5Z" fill="#FFE066" stroke="#1F2340" stroke-width="1.6" stroke-linejoin="round"></path></svg>
  <svg class="tw2" style="position: absolute; right: 40px; top: 228px" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5Z" fill="#FF9EC4" stroke="#1F2340" stroke-width="2" stroke-linejoin="round"></path></svg>
  <svg class="tw3" style="position: absolute; right: 62px; top: 420px" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5Z" fill="#FFFFFF" stroke="#1F2340" stroke-width="1.8" stroke-linejoin="round"></path></svg>
  <svg class="tw2" style="position: absolute; left: 70px; top: 440px" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5Z" fill="#9BE15D" stroke="#1F2340" stroke-width="2" stroke-linejoin="round"></path></svg>

  <div class="pop" style="position: absolute; left: 50%; top: 220px; width: 250px; height: 250px; margin-left: -125px">
    <svg width="250" height="250" viewBox="0 0 120 120" role="img" aria-label="어린나무 단계의 새싹이">
      <ellipse cx="60" cy="112" rx="30" ry="4" fill="#1F2340" opacity="0.35"></ellipse>
      <g stroke="#1F2340" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <path d="M55 72 L57 46 H63 L65 72Z" fill="#A8744A"></path>
        <path d="M34 46 Q26 30 42 24 Q46 10 62 12 Q78 8 82 24 Q96 30 86 46 Q80 56 60 52 Q40 56 34 46Z" fill="#7DCB55"></path>
        <path d="M61 50.5 Q79 54 85 45 Q91 37 87.5 30 Q79 43 61 45.5Z" fill="#5AA845" stroke="none"></path>
        <ellipse cx="47" cy="24" rx="7" ry="3.6" fill="#BDEE90" stroke="none"></ellipse>
        <path d="M38 76 H82 L77 104 Q76 109 71 109 H49 Q44 109 43 104 Z" fill="#F4A06C"></path>
        <path d="M66 77.5 H80 L75.5 103 Q74.5 107 70 107 H63 Q68 94 66 77.5 Z" fill="#DC7A4C" stroke="none"></path>
        <rect x="33" y="68" width="54" height="12" rx="5" fill="#F9BC8A"></rect>
        <rect x="38" y="71" width="20" height="3" rx="1.5" fill="#FFE2C6" stroke="none"></rect>
        <path d="M46.5 91 Q51 85 55.5 91" fill="none" stroke-width="2.6"></path>
        <path d="M64.5 91 Q69 85 73.5 91" fill="none" stroke-width="2.6"></path>
        <ellipse cx="44" cy="97" rx="4.4" ry="2.4" fill="#FF8FB1" stroke="none"></ellipse>
        <ellipse cx="76" cy="97" rx="4.4" ry="2.4" fill="#FF8FB1" stroke="none"></ellipse>
        <path d="M55.5 95.5 Q60 103 64.5 95.5Z" fill="#E8577F" stroke-width="2.2"></path>
      </g>
    </svg>
  </div>

  <section aria-label="성장 보상" style="position: absolute; left: 18px; right: 18px; bottom: 104px; background-color: #FFF7E8; color: #1F2340; border: 3px solid #1F2340; border-radius: 22px; box-shadow: 6px 6px 0 #FF6FA5; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-family: 'Black Han Sans', sans-serif; font-size: 22px">어린나무 단계 해금!</span>
      <span style="background-color: #9BE15D; border: 2.5px solid #1F2340; border-radius: 999px; padding: 2px 10px; font-size: 14px">NEW</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px">
      <div style="border: 2.5px solid #1F2340; border-radius: 12px; background-color: #FFD3BF; padding: 6px 0; display: flex; flex-direction: column; align-items: center"><span style="font-size: 13px">STR</span><span style="font-family: 'Black Han Sans', sans-serif; font-size: 20px">+1</span></div>
      <div style="border: 2.5px solid #1F2340; border-radius: 12px; background-color: #C9EFCB; padding: 6px 0; display: flex; flex-direction: column; align-items: center"><span style="font-size: 13px">VIT</span><span style="font-family: 'Black Han Sans', sans-serif; font-size: 20px">+2</span></div>
      <div style="border: 2.5px solid #1F2340; border-radius: 12px; background-color: #CFE4FC; padding: 6px 0; display: flex; flex-direction: column; align-items: center"><span style="font-size: 13px">DISC</span><span style="font-family: 'Black Han Sans', sans-serif; font-size: 20px">+1</span></div>
      <div style="border: 2.5px solid #1F2340; border-radius: 12px; background-color: #E3D9FF; padding: 6px 0; display: flex; flex-direction: column; align-items: center"><span style="font-size: 13px">REC</span><span style="font-family: 'Black Han Sans', sans-serif; font-size: 20px">+1</span></div>
    </div>
    <span style="font-size: 14px; color: #4A5080">다음 단계 · 나무 Lv.15</span>
  </section>

  <div style="position: absolute; left: 18px; right: 18px; bottom: 30px">
    <button type="button" style="width: 100%; height: 56px; border: 3px solid #1F2340; border-radius: 18px; background-color: #FFE066; color: #1F2340; font-family: 'Black Han Sans', sans-serif; font-size: 22px; box-shadow: 0 5px 0 #C9A21C">계속하기</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"burst":{"editor":"color","default":"#2E3570"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { burst: this.props.burst ?? '#2E3570' };
  }
}
</script>
</body>
</html>
