<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>홈 — 다크 모드</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F3F0FF}a:hover{color:#B4B9E0}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
@keyframes twinkle{0%,100%{transform:scale(.6) rotate(0deg);opacity:.5}50%{transform:scale(1.1) rotate(25deg);opacity:1}}
@keyframes stripes{from{background-position:0 0}to{background-position:28px 0}}
.bob{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 90%}
.tw{animation:twinkle 1.8s ease-in-out infinite}
.tw2{animation:twinkle 2.3s ease-in-out .6s infinite}
.tw3{animation:twinkle 2s ease-in-out 1.1s infinite}
.flow{animation:stripes 1.2s linear infinite}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1120px; box-sizing: border-box; background-color: #14172B; font-family: 'Jua', sans-serif; color: #F3F0FF; padding: 20px 18px 28px; display: flex; flex-direction: column; gap: 18px">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-family: 'Black Han Sans', sans-serif; font-weight: 400; font-size: 28px; line-height: 1.1; color: #F3F0FF; letter-spacing: 0.5px">Wellness <span style="color: #8ED65A">Game</span></h1>
      <span style="font-size: 14px; color: #B4B9E0">10월 4일 일요일</span>
    </div>
    <button type="button" style="height: 44px; padding: 0 16px; border: 3px solid #070914; border-radius: 999px; background-color: #262B4D; color: #F3F0FF; font-size: 15px; box-shadow: 3px 3px 0 #6C5CE7; display: flex; align-items: center; gap: 6px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
      로그인
    </button>
  </header>

  <section aria-label="캐릭터" style="position: relative; height: 372px; border: 3px solid #070914; border-radius: 24px; box-shadow: 6px 6px 0 #6C5CE7; background-color: {{sky}}; background-image: radial-gradient(rgba(255,255,255,0.22) 1.6px, transparent 1.8px); background-size: 12px 12px; overflow: hidden">
    <svg style="position: absolute; left: 0; bottom: 0; width: 100%; height: 110px" viewBox="0 0 390 110" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 52 Q70 24 150 46 T300 40 T390 50 V110 H0Z" fill="#3E7A4A" stroke="#070914" stroke-width="3"></path>
      <path d="M0 74 Q90 58 190 72 T390 70 V110 H0Z" fill="#2F6239"></path>
    </svg>

    <div style="position: absolute; left: 16px; top: 16px; max-width: 196px; background-color: #262B4D; border: 3px solid #070914; border-radius: 18px; padding: 10px 14px; font-size: 15px; line-height: 1.35">
      오늘 7,842걸음 걸었어! 조금만 더 걸으면 쑥쑥 자랄 것 같아!
      <svg style="position: absolute; left: 34px; bottom: -17px" width="26" height="18" viewBox="0 0 26 18" aria-hidden="true"><path d="M2 0 L12 16 L22 0" fill="#262B4D" stroke="#070914" stroke-width="3" stroke-linejoin="round"></path><rect x="3" y="0" width="18" height="2" fill="#262B4D"></rect></svg>
    </div>

    <svg class="tw" style="position: absolute; right: 34px; top: 26px" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5Z" fill="#FFE066" stroke="#1F2340" stroke-width="1.6" stroke-linejoin="round"></path></svg>
    <svg class="tw2" style="position: absolute; right: 78px; top: 84px" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5Z" fill="#FFFFFF" stroke="#1F2340" stroke-width="2" stroke-linejoin="round"></path></svg>
    <svg class="tw3" style="position: absolute; left: 48px; top: 150px" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5Z" fill="#FF9EC4" stroke="#1F2340" stroke-width="2" stroke-linejoin="round"></path></svg>

    <svg style="position: absolute; right: 22px; top: 140px" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="#FFE9A3" stroke="#070914" stroke-width="1.6" stroke-linejoin="round"></path></svg>

    <div class="bob" style="position: absolute; left: 50%; top: 92px; width: 220px; height: 220px; margin-left: -110px">
      <svg width="220" height="220" viewBox="0 0 120 120" role="img" aria-label="줄기 단계의 새싹이">
        <ellipse cx="60" cy="112" rx="30" ry="4" fill="#1F2340" opacity="0.18"></ellipse>
        <g stroke="#1F2340" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
          <rect x="57" y="30" width="6" height="42" rx="3" fill="#5BB04F"></rect>
          <path d="M58 60 Q44 60 38 48 Q52 44 58 60Z" fill="#8ED65A"></path>
          <path d="M62 50 Q76 50 84 38 Q68 34 62 50Z" fill="#8ED65A"></path>
          <path d="M58 40 Q48 38 44 28 Q55 26 58 40Z" fill="#8ED65A"></path>
          <path d="M60 31 Q54 22 60 12 Q66 22 60 31Z" fill="#B4EA7A"></path>
          <path d="M38 76 H82 L77 104 Q76 109 71 109 H49 Q44 109 43 104 Z" fill="#F4A06C"></path>
          <path d="M66 77.5 H80 L75.5 103 Q74.5 107 70 107 H63 Q68 94 66 77.5 Z" fill="#DC7A4C" stroke="none"></path>
          <rect x="33" y="68" width="54" height="12" rx="5" fill="#F9BC8A"></rect>
          <rect x="38" y="71" width="20" height="3" rx="1.5" fill="#FFE2C6" stroke="none"></rect>
          <ellipse cx="51" cy="90" rx="4.2" ry="5.6" fill="#1F2340" stroke="none"></ellipse>
          <ellipse cx="69" cy="90" rx="4.2" ry="5.6" fill="#1F2340" stroke="none"></ellipse>
          <circle cx="52.4" cy="87.8" r="1.7" fill="#FFFFFF" stroke="none"></circle>
          <circle cx="70.4" cy="87.8" r="1.7" fill="#FFFFFF" stroke="none"></circle>
          <circle cx="49.8" cy="92.4" r="0.8" fill="#FFFFFF" stroke="none"></circle>
          <circle cx="67.8" cy="92.4" r="0.8" fill="#FFFFFF" stroke="none"></circle>
          <ellipse cx="44" cy="97" rx="4" ry="2.2" fill="#FF8FB1" stroke="none"></ellipse>
          <ellipse cx="76" cy="97" rx="4" ry="2.2" fill="#FF8FB1" stroke="none"></ellipse>
          <path d="M57 97 Q60 100.5 63 97" fill="none" stroke-width="2.2"></path>
        </g>
      </svg>
    </div>

    <div style="position: absolute; left: 16px; right: 16px; bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <div style="background-color: #FFE066; color: #14172B; border-radius: 12px; padding: 6px 14px; font-family: 'Black Han Sans', sans-serif; font-size: 20px; transform: skewX(-8deg)">새싹이</div>
      <div style="background-color: #262B4D; border: 3px solid #070914; border-radius: 999px; padding: 4px 12px; font-size: 15px">Lv.7 · 줄기 단계</div>
    </div>
  </section>

  <section aria-label="경험치" style="background-color: #262B4D; border: 3px solid #070914; border-radius: 20px; box-shadow: 4px 4px 0 #6C5CE7; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-family: 'Black Han Sans', sans-serif; font-size: 22px; letter-spacing: 1px">EXP</span>
      <span style="background-color: {{accent}}; border: 2.5px solid #070914; border-radius: 999px; padding: 2px 10px; font-size: 15px; color: #1F2340">오늘 +180 XP</span>
    </div>
    <div role="progressbar" aria-valuemin="0" aria-valuemax="2000" aria-valuenow="1240" aria-label="경험치" style="height: 24px; border: 3px solid #070914; border-radius: 14px; background-color: #3A4070; overflow: hidden">
      <div class="flow" style="width: 62%; height: 100%; background-color: #9BE15D; background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.45) 0 7px, transparent 7px 14px); border-right: 3px solid #070914; box-sizing: border-box"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 15px">
      <span>1,240 / 2,000 XP</span>
      <span style="color: #B4B9E0">어린나무까지 Lv.10</span>
    </div>
  </section>

  <section aria-label="스탯" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px">
    <div style="border: 3px solid #070914; border-radius: 16px; background-color: #262B4D; overflow: hidden; display: flex; flex-direction: column; align-items: center">
      <div style="width: 100%; background-color: #FF9A6C; border-bottom: 3px solid #070914; padding: 6px 0; display: flex; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F2340" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"></path></svg>
      </div>
      <span style="font-family: 'Black Han Sans', sans-serif; font-size: 26px; line-height: 1; padding-top: 8px">12</span>
      <span style="font-size: 13px; padding: 4px 0 8px">STR 근력</span>
    </div>
    <div style="border: 3px solid #070914; border-radius: 16px; background-color: #262B4D; overflow: hidden; display: flex; flex-direction: column; align-items: center">
      <div style="width: 100%; background-color: #7DD484; border-bottom: 3px solid #070914; padding: 6px 0; display: flex; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F2340" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
      </div>
      <span style="font-family: 'Black Han Sans', sans-serif; font-size: 26px; line-height: 1; padding-top: 8px">18</span>
      <span style="font-size: 13px; padding: 4px 0 8px">VIT 활력</span>
    </div>
    <div style="border: 3px solid #070914; border-radius: 16px; background-color: #262B4D; overflow: hidden; display: flex; flex-direction: column; align-items: center">
      <div style="width: 100%; background-color: #7FB8F7; border-bottom: 3px solid #070914; padding: 6px 0; display: flex; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F2340" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="4"></circle><circle cx="12" cy="12" r="0.8" fill="#1F2340"></circle></svg>
      </div>
      <span style="font-family: 'Black Han Sans', sans-serif; font-size: 26px; line-height: 1; padding-top: 8px">9</span>
      <span style="font-size: 13px; padding: 4px 0 8px">DISC 절제</span>
    </div>
    <div style="border: 3px solid #070914; border-radius: 16px; background-color: #262B4D; overflow: hidden; display: flex; flex-direction: column; align-items: center">
      <div style="width: 100%; background-color: #B9A2F5; border-bottom: 3px solid #070914; padding: 6px 0; display: flex; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F2340" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
      </div>
      <span style="font-family: 'Black Han Sans', sans-serif; font-size: 26px; line-height: 1; padding-top: 8px">15</span>
      <span style="font-size: 13px; padding: 4px 0 8px">REC 회복</span>
    </div>
  </section>

  <section aria-label="오늘의 퀘스트" style="display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0; font-family: 'Black Han Sans', sans-serif; font-weight: 400; font-size: 22px; display: flex; align-items: center; gap: 8px">
      <span style="display: inline-block; width: 10px; height: 22px; background-color: #3F8F3A; border: 2.5px solid #070914; border-radius: 3px; transform: skewX(-12deg)"></span>
      오늘의 퀘스트
    </h2>

    <div style="background-color: #262B4D; border: 3px solid #070914; border-radius: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
      <div style="width: 46px; height: 46px; flex: none; border: 3px solid #070914; border-radius: 14px; background-color: #CFF3B5; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F2340" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4" r="2"></circle><path d="M9 21l2-6 3 3v3M7 12l3-4 4 1 3 4M11 15l-1-4"></path></svg>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; font-size: 16px"><span>걸음 수</span><span>7,842 / 10,000</span></div>
        <div style="height: 12px; border: 2.5px solid #070914; border-radius: 8px; background-color: #3A4070; overflow: hidden"><div style="width: 78%; height: 100%; background-color: #7DD484"></div></div>
      </div>
    </div>

    <div style="background-color: #262B4D; border: 3px solid #070914; border-radius: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
      <div style="width: 46px; height: 46px; flex: none; border: 3px solid #070914; border-radius: 14px; background-color: #FFD9C7; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F2340" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="15" cy="4" r="2"></circle><path d="M5 21l4-5 3 2 1-5 4 3 2-1M8 10l3-3 4 2"></path></svg>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px">러닝 32분</span>
        <span style="font-size: 13px; color: #B4B9E0">07:10 · Apple 건강</span>
      </div>
      <span style="background-color: #FFE066; color: #14172B; border: 2.5px solid #070914; border-radius: 999px; padding: 2px 10px; font-size: 14px">+60 XP</span>
    </div>

    <div style="background-color: #262B4D; border: 3px solid #070914; border-radius: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
      <div style="width: 46px; height: 46px; flex: none; border: 3px solid #070914; border-radius: 14px; background-color: #E3D9FF; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F2340" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px">수면 7시간 20분</span>
        <span style="font-size: 13px; color: #B4B9E0">수면 점수 86 · 꿀잠 보너스</span>
      </div>
      <span style="background-color: #FFE066; color: #14172B; border: 2.5px solid #070914; border-radius: 999px; padding: 2px 10px; font-size: 14px">+40 XP</span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sky":{"editor":"color","default":"#2B3470"},"accent":{"editor":"color","default":"#FFB3CF"},"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      sky: this.props.sky ?? '#2B3470',
      accent: this.props.accent ?? '#FFB3CF'
    };
  }
}
</script>
</body>
</html>
