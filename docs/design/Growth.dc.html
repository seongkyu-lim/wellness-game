<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>성장 도감</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F2340}a:hover{color:#4A5080}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bob{animation:bob 2.2s ease-in-out infinite}
.locked{filter:brightness(0);opacity:.16}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background-color: #FFF7E8; background-image: radial-gradient(#F1E3C4 1.4px, transparent 1.6px); background-size: 14px 14px; font-family: 'Jua', sans-serif; color: #1F2340; padding: 20px 18px 24px; display: flex; flex-direction: column; gap: 16px">

  <header style="display: flex; align-items: center; gap: 12px">
    <button type="button" aria-label="뒤로" style="width: 44px; height: 44px; flex: none; border: 3px solid #1F2340; border-radius: 14px; background-color: #FFFFFF; color: #1F2340; display: flex; align-items: center; justify-content: center; box-shadow: 3px 3px 0 #1F2340">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <div style="display: flex; flex-direction: column">
      <h1 style="margin: 0; font-family: 'Black Han Sans', sans-serif; font-weight: 400; font-size: 28px; line-height: 1.1">성장 도감</h1>
      <span style="font-size: 14px; color: #4A5080">6단계 중 3단계 달성</span>
    </div>
  </header>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: 1">

    <div style="border: 3px solid #1F2340; border-radius: 20px; background-color: #FFFFFF; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg width="116" height="116" viewBox="0 0 120 120" role="img" aria-label="씨앗 단계">
        <g stroke="#1F2340" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
          <ellipse cx="60" cy="64" rx="11" ry="9" fill="#C8935E"></ellipse>
          <path d="M55 60 Q60 56 65 60" fill="none" stroke-width="2"></path>
          <path d="M38 76 H82 L77 104 Q76 109 71 109 H49 Q44 109 43 104 Z" fill="#F4A06C"></path>
          <path d="M66 77.5 H80 L75.5 103 Q74.5 107 70 107 H63 Q68 94 66 77.5 Z" fill="#DC7A4C" stroke="none"></path>
          <rect x="33" y="68" width="54" height="12" rx="5" fill="#F9BC8A"></rect>
          <path d="M46.5 90 Q51 93 55.5 90" fill="none" stroke-width="2.4"></path>
          <path d="M64.5 90 Q69 93 73.5 90" fill="none" stroke-width="2.4"></path>
          <ellipse cx="44" cy="97" rx="4" ry="2.2" fill="#FF8FB1" stroke="none"></ellipse>
          <ellipse cx="76" cy="97" rx="4" ry="2.2" fill="#FF8FB1" stroke="none"></ellipse>
          <path d="M58 98 Q60 99.5 62 98" fill="none" stroke-width="2"></path>
        </g>
      </svg>
      <span style="font-family: 'Black Han Sans', sans-serif; font-size: 19px">씨앗</span>
      <span style="font-size: 13px; color: #4A5080">Lv.1</span>
    </div>

    <div style="border: 3px solid #1F2340; border-radius: 20px; background-color: #FFFFFF; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg width="116" height="116" viewBox="0 0 120 120" role="img" aria-label="새싹 단계">
        <g stroke="#1F2340" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
          <rect x="57" y="48" width="6" height="24" rx="3" fill="#5BB04F"></rect>
          <path d="M58 58 Q44 58 40 46 Q54 42 58 58Z" fill="#8ED65A"></path>
          <path d="M62 54 Q74 52 80 40 Q66 38 62 54Z" fill="#8ED65A"></path>
          <path d="M38 76 H82 L77 104 Q76 109 71 109 H49 Q44 109 43 104 Z" fill="#F4A06C"></path>
          <path d="M66 77.5 H80 L75.5 103 Q74.5 107 70 107 H63 Q68 94 66 77.5 Z" fill="#DC7A4C" stroke="none"></path>
          <rect x="33" y="68" width="54" height="12" rx="5" fill="#F9BC8A"></rect>
          <ellipse cx="51" cy="90" rx="4.2" ry="5.6" fill="#1F2340" stroke="none"></ellipse>
          <ellipse cx="69" cy="90" rx="4.2" ry="5.6" fill="#1F2340" stroke="none"></ellipse>
          <circle cx="52.4" cy="87.8" r="1.7" fill="#FFFFFF" stroke="none"></circle>
          <circle cx="70.4" cy="87.8" r="1.7" fill="#FFFFFF" stroke="none"></circle>
          <ellipse cx="44" cy="97" rx="4" ry="2.2" fill="#FF8FB1" stroke="none"></ellipse>
          <ellipse cx="76" cy="97" rx="4" ry="2.2" fill="#FF8FB1" stroke="none"></ellipse>
          <path d="M57 97 Q60 100.5 63 97" fill="none" stroke-width="2.2"></path>
        </g>
      </svg>
      <span style="font-family: 'Black Han Sans', sans-serif; font-size: 19px">새싹</span>
      <span style="font-size: 13px; color: #4A5080">Lv.3</span>
    </div>

    <div style="position: relative; border: 3px solid #1F2340; border-radius: 20px; background-color: {{highlight}}; box-shadow: 5px 5px 0 #1F2340; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <span style="position: absolute; top: -12px; right: 10px; background-color: #1F2340; color: #FFE066; border-radius: 8px; padding: 2px 10px; font-family: 'Black Han Sans', sans-serif; font-size: 14px; transform: rotate(4deg)">NOW</span>
      <svg class="bob" width="116" height="116" viewBox="0 0 120 120" role="img" aria-label="줄기 단계, 현재">
        <g stroke="#1F2340" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
          <rect x="57" y="30" width="6" height="42" rx="3" fill="#5BB04F"></rect>
          <path d="M58 60 Q44 60 38 48 Q52 44 58 60Z" fill="#8ED65A"></path>
          <path d="M62 50 Q76 50 84 38 Q68 34 62 50Z" fill="#8ED65A"></path>
          <path d="M58 40 Q48 38 44 28 Q55 26 58 40Z" fill="#8ED65A"></path>
          <path d="M60 31 Q54 22 60 12 Q66 22 60 31Z" fill="#B4EA7A"></path>
          <path d="M38 76 H82 L77 104 Q76 109 71 109 H49 Q44 109 43 104 Z" fill="#F4A06C"></path>
          <path d="M66 77.5 H80 L75.5 103 Q74.5 107 70 107 H63 Q68 94 66 77.5 Z" fill="#DC7A4C" stroke="none"></path>
          <rect x="33" y="68" width="54" height="12" rx="5" fill="#F9BC8A"></rect>
          <ellipse cx="51" cy="90" rx="4.2" ry="5.6" fill="#1F2340" stroke="none"></ellipse>
          <ellipse cx="69" cy="90" rx="4.2" ry="5.6" fill="#1F2340" stroke="none"></ellipse>
          <circle cx="52.4" cy="87.8" r="1.7" fill="#FFFFFF" stroke="none"></circle>
          <circle cx="70.4" cy="87.8" r="1.7" fill="#FFFFFF" stroke="none"></circle>
          <ellipse cx="44" cy="97" rx="4" ry="2.2" fill="#FF8FB1" stroke="none"></ellipse>
          <ellipse cx="76" cy="97" rx="4" ry="2.2" fill="#FF8FB1" stroke="none"></ellipse>
          <path d="M57 97 Q60 100.5 63 97" fill="none" stroke-width="2.2"></path>
        </g>
      </svg>
      <span style="font-family: 'Black Han Sans', sans-serif; font-size: 19px">줄기</span>
      <span style="font-size: 13px; color: #1F2340">Lv.6 · 지금 Lv.7</span>
    </div>

    <div style="border: 3px dashed #8A8FB0; border-radius: 20px; background-color: #FFFFFF; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg class="locked" width="116" height="116" viewBox="0 0 120 120" role="img" aria-label="잠긴 단계">
        <g stroke="#1F2340" stroke-width="3" stroke-linejoin="round">
          <path d="M55 72 L57 46 H63 L65 72Z" fill="#1F2340"></path>
          <path d="M34 46 Q26 30 42 24 Q46 10 62 12 Q78 8 82 24 Q96 30 86 46 Q80 56 60 52 Q40 56 34 46Z" fill="#1F2340"></path>
          <path d="M38 76 H82 L77 104 Q76 109 71 109 H49 Q44 109 43 104 Z" fill="#1F2340"></path>
          <rect x="33" y="68" width="54" height="12" rx="5" fill="#1F2340"></rect>
        </g>
      </svg>
      <span style="font-family: 'Black Han Sans', sans-serif; font-size: 19px">어린나무</span>
      <span style="font-size: 13px; color: #4A5080; display: flex; align-items: center; gap: 4px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Lv.10에 해금</span>
    </div>

    <div style="border: 3px dashed #8A8FB0; border-radius: 20px; background-color: #FFFFFF; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg class="locked" width="116" height="116" viewBox="0 0 120 120" role="img" aria-label="잠긴 단계">
        <g stroke="#1F2340" stroke-width="3" stroke-linejoin="round">
          <path d="M52 72 L55 40 H65 L68 72Z" fill="#1F2340"></path>
          <path d="M26 44 Q16 26 34 18 Q40 2 60 4 Q80 2 86 18 Q104 26 94 44 Q86 58 60 54 Q34 58 26 44Z" fill="#1F2340"></path>
          <path d="M38 76 H82 L77 104 Q76 109 71 109 H49 Q44 109 43 104 Z" fill="#1F2340"></path>
          <rect x="33" y="68" width="54" height="12" rx="5" fill="#1F2340"></rect>
        </g>
      </svg>
      <span style="font-family: 'Black Han Sans', sans-serif; font-size: 19px">나무</span>
      <span style="font-size: 13px; color: #4A5080; display: flex; align-items: center; gap: 4px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Lv.15에 해금</span>
    </div>

    <div style="border: 3px dashed #8A8FB0; border-radius: 20px; background-color: #FFFFFF; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg class="locked" width="116" height="116" viewBox="0 0 120 120" role="img" aria-label="잠긴 단계">
        <g stroke="#1F2340" stroke-width="3" stroke-linejoin="round">
          <path d="M52 72 L55 40 H65 L68 72Z" fill="#1F2340"></path>
          <path d="M26 44 Q16 26 34 18 Q40 2 60 4 Q80 2 86 18 Q104 26 94 44 Q86 58 60 54 Q34 58 26 44Z" fill="#1F2340"></path>
          <circle cx="36" cy="30" r="6" fill="#1F2340"></circle>
          <circle cx="62" cy="12" r="6" fill="#1F2340"></circle>
          <circle cx="86" cy="32" r="6" fill="#1F2340"></circle>
          <path d="M38 76 H82 L77 104 Q76 109 71 109 H49 Q44 109 43 104 Z" fill="#1F2340"></path>
          <rect x="33" y="68" width="54" height="12" rx="5" fill="#1F2340"></rect>
        </g>
      </svg>
      <span style="font-family: 'Black Han Sans', sans-serif; font-size: 19px">개화</span>
      <span style="font-size: 13px; color: #4A5080; display: flex; align-items: center; gap: 4px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Lv.20에 해금</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"highlight":{"editor":"color","default":"#FFE88A"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { highlight: this.props.highlight ?? '#FFE88A' };
  }
}
</script>
</body>
</html>
