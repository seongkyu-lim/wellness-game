plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.15'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.wellnessgame'
version = '0.1.0'
description = 'Health activity XP and character progression API'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    // API 문서(Swagger UI). APP_API_DOCS_ENABLED 로 켜고 끈다(#93).
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    runtimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 로컬 실행(./gradlew bootRun)은 개발용 JWT 키가 든 local 프로필로 띄운다.
// 배포 jar 는 프로필 없이 실행되므로 AUTH_JWT_SECRET 이 없으면 기동에 실패한다.
tasks.named('bootRun') {
    systemProperty 'spring.profiles.active', System.getenv('SPRING_PROFILES_ACTIVE') ?: 'local'
}

// 기본 테스트는 인메모리 H2(PostgreSQL 호환 모드)로 돈다. 실제 PostgreSQL 이 필요한 테스트(@Tag("postgres"))는 postgresTest 로 따로 실행한다.
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'postgres'
    }
}

// Docker 가 필요하다(Testcontainers, PostgreSQL 17). Docker 가 없으면 로컬에서는 건너뛰고 CI 에서는 실패한다.
tasks.register('postgresTest', Test) {
    description = 'Runs PostgreSQL Testcontainers integration tests (@Tag("postgres")).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'postgres'
    }
    shouldRunAfter tasks.named('test')
}

// 커버리지(#152): test(H2)와 postgresTest(Testcontainers)의 실행 데이터를 합쳐 HTML/XML 리포트를 만든다.
//  - ./gradlew test                  -> build/reports/jacoco/test/html/index.html (H2 실행분)
//  - ./gradlew test postgresTest     -> 두 실행분을 합친 리포트(마이그레이션 V4·V6 같은 PostgreSQL 전용 코드가 포함된다)
jacoco {
    toolVersion = '0.8.13'
}

// 앱 진입점(main)은 단위·통합 테스트로 다루지 않는다.
def jacocoExcludes = ['com/wellnessgame/WellnessGameApplication*']

tasks.named('jacocoTestReport') {
    description = 'test + postgresTest 실행 데이터를 합친 커버리지 리포트(HTML/XML).'
    // 존재하는 exec 만 합친다. postgresTest 는 Docker 가 필요하므로 의존하지 않는다.
    // test 에 의존하지 않는다: postgresTest 만 돌려도 H2 전체 스위트가 따라 돌지 않게 순서(mustRunAfter)만 둔다.
    mustRunAfter tasks.named('test'), tasks.named('postgresTest')
    executionData.setFrom(files(
            layout.buildDirectory.file('jacoco/test.exec'),
            layout.buildDirectory.file('jacoco/postgresTest.exec')).filter { it.exists() })
    reports {
        html.required = true
        xml.required = true
    }
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(it) { exclude jacocoExcludes }
    }))
}

// 검증 규칙: 기본 test(H2, Docker 불필요) 실행 데이터만으로 판정한다. 그래서 check/build 가 Docker 없이도 돈다.
// 현재 H2 실행분은 줄 96.8%, 분기 91.1% 다. 그보다 조금 낮게 잡아 커버리지 하락을 막되 사소한 변경에는 깨지지 않게 한다.
// postgresTest 까지 합치면 더 높아지지만(마이그레이션 V4·V6) Docker 를 요구하게 되므로 규칙은 H2 기준으로 둔다.
tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test')
    executionData.setFrom(layout.buildDirectory.file('jacoco/test.exec'))
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(it) { exclude jacocoExcludes }
    }))
    // 번들 줄 기준 0.95 는 전체의 약 4~5%, 곧 36줄 안팎(현재 미커버 약 36줄 수준)의 미커버를 허용한다.
    // 한 클래스를 통째로 비워 둬도 번들 평균에 가려지므로 아래에 클래스별 하한(0.6)을 따로 둔다.
    violationRules {
        rule {
            element = 'CLASS'
            // 제외 근거: V4·V6 은 PostgreSQL 전용 SQL 이라 H2 에서는 건너뛰고 postgresTest 가 검증한다.
            // Sha256 은 도달할 수 없는 NoSuchAlgorithmException 분기와 private 생성자만 남는다.
            excludes = ['db.migration.V4__*', 'db.migration.V6__*', 'com.wellnessgame.auth.Sha256']
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.6
            }
        }
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.95
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.88
            }
        }
    }
}

tasks.named('test') {
    finalizedBy tasks.named('jacocoTestReport')
}
tasks.named('postgresTest') {
    finalizedBy tasks.named('jacocoTestReport')
}
tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
