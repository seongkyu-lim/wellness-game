# 사용자에게 보이는 응답 문구 (기본 = 한국어). 영어는 messages_en.properties, 용어는 backend/GLOSSARY.md 참고.
# 두 파일의 키 집합은 같아야 한다(MessagesPropertiesTest).
# 인자가 있는 문구는 MessageFormat 으로 서식화된다. 자릿수 구분 없이 쓸 숫자는 {0,number,#}.

# ---- 활동 결과 (POST /api/health-activities/sync → activityResults[].message) ----
activity.reward.steps=걸음 수 보상 +{0,number,#} XP
activity.reward.workout={0} 완료 +{1,number,#} XP
activity.reward.sleep=수면 회복 보너스 +{0,number,#} XP
activity.reward.capped={0} (일일 XP 상한 도달)
activity.result.duplicate={0} 이미 반영됨
activity.result.overlap={0} 겹치는 기록이 이미 반영됨
activity.result.rejected={0} 기록을 반영하지 않았어요: {1}

# ---- 운동 이름 (WorkoutType) ----
workout.name.SWIMMING=수영
workout.name.RUNNING=달리기
workout.name.WALKING=걷기
workout.name.CYCLING=자전거
workout.name.STRENGTH_TRAINING=근력 운동
workout.name.OTHER=운동

# ---- 동기화 요청 구조 오류 (400) ----
sync.error.activities-empty=동기화할 활동이 없습니다.
sync.error.too-many-activities=한 번에 최대 {0}개의 활동까지 동기화할 수 있습니다.
sync.error.date-required=동기화 날짜가 필요합니다.
sync.error.date-out-of-range=동기화 날짜는 오늘 기준 ±{0}일 이내여야 합니다.
sync.error.type-required=활동 유형이 필요합니다.
sync.error.steps-required=STEPS 활동에는 steps가 필요합니다.
sync.error.workout-times-required=WORKOUT 활동에는 startedAt과 endedAt이 필요합니다.
sync.error.sleep-fields-required=SLEEP 활동에는 sleepMinutes, startedAt, endedAt이 필요합니다.
sync.error.end-before-start=활동 종료 시간은 시작 시간 이후여야 합니다.

