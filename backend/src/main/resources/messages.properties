sync.reason.future-time=활동 시간은 현재 시각 이후일 수 없습니다.
sync.reason.outside-date-window=활동 시간이 동기화 날짜 범위를 벗어났습니다.
sync.reason.steps-range=걸음 수는 0 이상 {0,number,#} 이하여야 합니다.
sync.reason.workout-end-not-after-start=운동 종료 시간은 시작 시간보다 늦어야 합니다.
sync.reason.workout-too-long=운동 한 건은 최대 {0}시간까지 기록할 수 있습니다.
sync.reason.workout-minutes-range=운동 시간은 0분 이상 {0,number,#}분 이하여야 합니다.
