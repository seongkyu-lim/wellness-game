# User-facing response messages in English. Keys must match messages.properties (MessagesPropertiesTest).
# Terminology: backend/GLOSSARY.md. Use ’ (U+2019) for contractions: a plain ' is a MessageFormat quote.

# ---- Activity results (POST /api/health-activities/sync -> activityResults[].message) ----
activity.reward.steps=Step reward +{0,number,#} XP
activity.reward.workout={0} complete +{1,number,#} XP
activity.reward.sleep=Sleep recovery bonus +{0,number,#} XP
activity.reward.capped={0} (daily XP cap reached)
activity.result.duplicate={0} already counted
activity.result.overlap={0} overlaps a workout that’s already counted
activity.result.rejected={0} wasn’t counted: {1}

# ---- Workout names (WorkoutType) ----
workout.name.SWIMMING=Swimming
workout.name.RUNNING=Running
workout.name.WALKING=Walking
workout.name.CYCLING=Cycling
workout.name.STRENGTH_TRAINING=Strength training
workout.name.OTHER=Workout

# ---- Sync request structure errors (400) ----
sync.error.activities-empty=There are no activities to sync.
sync.error.too-many-activities=You can sync up to {0} activities at a time.
sync.error.date-required=A sync date is required.
sync.error.date-out-of-range=The sync date must be within {0,choice,1#1 day|1<{0,number,integer} days} of today.
sync.error.type-required=Activity type is required.
sync.error.steps-required=STEPS activities need a steps value.
sync.error.workout-times-required=WORKOUT activities need startedAt and endedAt.
sync.error.sleep-fields-required=SLEEP activities need sleepMinutes, startedAt, and endedAt.
sync.error.end-before-start=An activity can’t end before it starts.

# ---- Per-activity value violations (only that item is skipped) ----
sync.reason.future-time=Activity times can’t be in the future.
sync.reason.outside-date-window=The activity time is outside the sync date range.
sync.reason.steps-range=Steps must be between 0 and {0,number,integer}.
sync.reason.workout-end-not-after-start=A workout must end after it starts.
sync.reason.workout-too-long=A single workout can be at most {0} hours long.
sync.reason.workout-minutes-range=Workout duration must be between 0 and {0,number,integer} minutes.
sync.reason.workout-minutes-exceed-span=Workout duration (durationMinutes) is longer than the time between start and end.
sync.reason.sleep-minutes-range=Sleep duration must be between 0 and {0,number,integer} minutes.
sync.reason.sleep-minutes-exceed-span=Sleep duration (sleepMinutes) is longer than the time between start and end.
sync.reason.calories-range=Calories must be between 0 and {0,number,integer}.
sync.reason.calories-per-minute=Too many calories for the workout length (max {0} kcal per minute).
sync.reason.distance-range=Distance must be between 0 and {0,number,integer} m.
sync.reason.sleep-score-range=Sleep score must be between {0} and {1}.

