spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/wellness_game?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:wellness}
    password: ${DATABASE_PASSWORD:wellness}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

oauth:
  kakao:
    client-id: ${OAUTH_KAKAO_CLIENT_ID:}
    client-secret: ${OAUTH_KAKAO_CLIENT_SECRET:}
    token-uri: https://kauth.kakao.com/oauth/token
    profile-uri: https://kapi.kakao.com/v2/user/me
  naver:
    client-id: ${OAUTH_NAVER_CLIENT_ID:}
    client-secret: ${OAUTH_NAVER_CLIENT_SECRET:}
    token-uri: https://nid.naver.com/oauth2.0/token
    profile-uri: https://openapi.naver.com/v1/nid/me
  google:
    client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
    client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
    token-uri: https://oauth2.googleapis.com/token
    profile-uri: https://openidconnect.googleapis.com/v1/userinfo
