spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wellness_game}
    username: ${DATABASE_USERNAME:wellness}
    password: ${DATABASE_PASSWORD:wellness}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

