spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/wellness_game?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:wellness}
    password: ${DATABASE_PASSWORD:wellness}
  http:
    client:
      # 외부 인증 서버(구글 tokeninfo 등) 지연으로 요청 스레드가 고갈되지 않도록 제한
      connect-timeout: 3s
      read-timeout: 5s
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

app:
  timezone: ${APP_TIMEZONE:Asia/Seoul}
  migrations:
    sleep-keys:
      # 기동 시 구 형식 수면 로그 키(userId|start|end|SLEEP)를 새 형식으로 정리한다(#50, 멱등).
      enabled: ${APP_MIGRATIONS_SLEEP_KEYS_ENABLED:true}
  # 요청 빈도 제한(#48). 1분 고정 윈도우, 단일 인스턴스 인메모리. 0 이하면 해당 제한을 끈다.
  rate-limit:
    sync-per-minute: ${APP_RATE_LIMIT_SYNC_PER_MINUTE:30}     # POST /api/health-activities/sync, userId별
    auth-per-minute: ${APP_RATE_LIMIT_AUTH_PER_MINUTE:20}     # /api/auth/** 전체, IP별
    login-per-minute: ${APP_RATE_LIMIT_LOGIN_PER_MINUTE:10}   # /api/auth/login·signup, IP별(위와 함께 적용)
    # 신뢰하는 리버스 프록시 한 단 뒤에서만 true. X-Forwarded-For 의 마지막 주소를 클라이언트 IP 로 쓴다.
    trust-forwarded-header: ${APP_RATE_LIMIT_TRUST_FORWARDED_HEADER:false}
  # 아이디 로그인 잠금(#55). 같은 아이디로 연속 실패하면 잠금 시간 동안 거부한다. 0 이하면 끈다.
  auth:
    max-failed-logins: ${APP_AUTH_MAX_FAILED_LOGINS:5}
    lockout-minutes: ${APP_AUTH_LOCKOUT_MINUTES:15}

auth:
  jwt:
    # HMAC-SHA256 서명 키. 32바이트 미만(또는 미설정)이거나 같은 문자 반복처럼 단순하면 기동에 실패한다.
    # 로컬은 application-local.yml 참고.
    secret: ${AUTH_JWT_SECRET:}
    ttl: ${AUTH_JWT_TTL:30d}
    issuer: ${AUTH_JWT_ISSUER:wellness-game}
    audience: ${AUTH_JWT_AUDIENCE:wellness-game-api}
    # iss·aud 가 없는 #55 이전 토큰 허용. 배포 후 ttl(기본 30일)이 지나면 false 로 바꾼다(README 참고).
    accept-legacy-tokens: ${AUTH_JWT_ACCEPT_LEGACY_TOKENS:true}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

oauth:
  kakao:
    client-id: ${OAUTH_KAKAO_CLIENT_ID:}
    client-secret: ${OAUTH_KAKAO_CLIENT_SECRET:}
    token-uri: https://kauth.kakao.com/oauth/token
    profile-uri: https://kapi.kakao.com/v2/user/me
    # iOS 카카오 로그인(POST /api/auth/kakao/native). 비어 있으면 해당 엔드포인트는 503.
    # access_token_info 의 app_id 가 이 값(카카오 앱 ID, 숫자)과 같아야 한다.
    native-app-id: ${OAUTH_KAKAO_NATIVE_APP_ID:}
    access-token-info-uri: https://kapi.kakao.com/v1/user/access_token_info
  naver:
    client-id: ${OAUTH_NAVER_CLIENT_ID:}
    client-secret: ${OAUTH_NAVER_CLIENT_SECRET:}
    token-uri: https://nid.naver.com/oauth2.0/token
    # iOS 네이버 로그인(POST /api/auth/naver/native)도 이 profile-uri 로 토큰을 검증한다.
    # client-id 가 비어 있으면 해당 엔드포인트는 503. (네이버는 토큰의 발급 앱을 확인하는 API 가 없다)
    profile-uri: https://openapi.naver.com/v1/nid/me
  google:
    client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
    client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
    token-uri: https://oauth2.googleapis.com/token
    profile-uri: https://openidconnect.googleapis.com/v1/userinfo
  # iOS 구글 로그인 ID 토큰 검증(POST /api/auth/google/native).
  # aud 는 아래 client-ids(iOS) 와 oauth.google.client-id(웹) 중 하나여야 한다.
  google-native:
    client-ids: ${OAUTH_GOOGLE_IOS_CLIENT_ID:}
    tokeninfo-uri: https://oauth2.googleapis.com/tokeninfo
  # iOS Sign in with Apple identity token 검증(POST /api/auth/apple/native).
  # aud 가 bundle-id 와 같아야 한다. 비어 있으면 해당 엔드포인트는 503.
  apple:
    bundle-id: ${OAUTH_APPLE_BUNDLE_ID:}
    jwks-uri: https://appleid.apple.com/auth/keys
    jwks-cache-ttl: 1h
