name: Hono API CI

# hono-server/ (TypeScript, Hono) 타입 검사·테스트. API 테스트는 PostgreSQL 서비스 컨테이너에
# backend/db/schema.sql을 만들어 실행한다. 배포는 하지 않는다.
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'hono-server/**'
      - 'backend/db/schema.sql'
      - 'backend/src/main/resources/messages*.properties'
      - '.github/workflows/hono-ci.yml'
  push:
    # main 은 deploy.yml 이 배포 대상만 골라 이 워크플로를 workflow_call 로 호출한다(중복 실행 방지)
    branches: [dev]
    paths:
      - 'hono-server/**'
      - 'backend/db/schema.sql'
      - 'backend/src/main/resources/messages*.properties'
      - '.github/workflows/hono-ci.yml'
  workflow_dispatch:
  # deploy.yml 의 검증 잡에서 호출한다.
  workflow_call:

permissions:
  contents: read

# 다른 워크플로가 호출하면 github.workflow 는 호출자 이름이 되므로 워크플로마다 접두사를 따로 둔다.
# main 은 취소하지 않는다: 취소되면 그 실행의 배포가 빠지고 다음 실행의 변경 감지(event.before 기준)에도 안 잡힌다.
concurrency:
  group: hono-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: hono-server

jobs:
  test:
    name: Typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # postgres:16-alpine (다중 아키텍처 인덱스 digest 고정, 2026-10-21 조회). 올릴 때 docker buildx imagetools inspect 로 다시 조회
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: wellness
          POSTGRES_PASSWORD: wellness
          POSTGRES_DB: wellness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wellness -d wellness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://wellness:wellness@localhost:5432/wellness_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hono-server/package-lock.json
      # 의존성 설치 스크립트를 실행하지 않는다(타입 검사·테스트·tsc 빌드에 필요 없음을 확인했다)
      - run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Test (unit + PostgreSQL API)
        run: npm test
      - name: Build (Node)
        run: npm run build
