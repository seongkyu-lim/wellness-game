name: Hono API CI

# hono-server/ (TypeScript, Hono) 타입 검사·테스트. API 테스트는 PostgreSQL 서비스 컨테이너에
# backend/db/schema.sql을 만들어 실행한다. 배포는 하지 않는다.
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'hono-server/**'
      - 'backend/db/schema.sql'
      - 'backend/src/main/resources/messages*.properties'
      - '.github/workflows/hono-ci.yml'
  push:
    branches: [dev, main]
    paths:
      - 'hono-server/**'
      - 'backend/db/schema.sql'
      - 'backend/src/main/resources/messages*.properties'
      - '.github/workflows/hono-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: hono-server

jobs:
  test:
    name: Typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wellness
          POSTGRES_PASSWORD: wellness
          POSTGRES_DB: wellness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wellness -d wellness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://wellness:wellness@localhost:5432/wellness_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hono-server/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test (unit + PostgreSQL API)
        run: npm test
      - name: Build (Node)
        run: npm run build
