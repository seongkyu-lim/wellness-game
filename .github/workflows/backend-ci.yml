name: Backend CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치/PR의 이전 실행은 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Unit tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # build.gradle toolchain(17)에 맞춘다.
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # 기본은 main 에서만 캐시를 쓰므로 dev 도 쓰기 허용
          cache-read-only: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/main"]'), github.ref) }}
      - name: Test and build
        run: ./gradlew build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          retention-days: 7

  postgres-test:
    name: PostgreSQL integration tests (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Actions 는 CI=true 를 기본 설정하므로 Docker가 없으면 건너뛰지 않고 실패한다(PostgresTestServer).
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # build.gradle toolchain(17)에 맞춘다.
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # 기본은 main 에서만 캐시를 쓰므로 dev 도 쓰기 허용
          cache-read-only: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/main"]'), github.ref) }}
      - name: Docker info
        run: docker version
      - name: PostgreSQL tests
        run: ./gradlew postgresTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-postgres-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          retention-days: 7
