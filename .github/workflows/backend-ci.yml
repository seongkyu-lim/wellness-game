name: Backend CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치/PR의 이전 실행은 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Unit tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew test build -x test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          retention-days: 7

  mysql-test:
    name: MySQL integration tests (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # CI=true 이면 Docker가 없을 때 건너뛰지 않고 실패한다(MySqlIntegrationTest).
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Docker info
        run: docker version
      - name: MySQL tests
        run: ./gradlew mysqlTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-mysql-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          retention-days: 7
