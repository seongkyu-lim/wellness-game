name: Backend CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    # main 은 deploy.yml 이 배포 대상만 골라 이 워크플로를 workflow_call 로 호출한다(중복 실행 방지)
    branches: [dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:
  # deploy.yml 의 검증 잡에서 호출한다.
  workflow_call:

permissions:
  contents: read

# 같은 브랜치/PR의 이전 실행은 취소한다.
# 다른 워크플로가 호출하면 github.workflow 는 호출자 이름이 되므로 워크플로마다 접두사를 따로 둔다.
# main 은 취소하지 않는다: 취소되면 그 실행의 배포가 빠지고 다음 실행의 변경 감지(event.before 기준)에도 안 잡힌다.
concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Unit tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # build.gradle toolchain(17)에 맞춘다.
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # 기본은 main 에서만 캐시를 쓰므로 dev 도 쓰기 허용
          cache-read-only: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/main"]'), github.ref) }}
      - name: Test and build
        run: ./gradlew build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          retention-days: 7

  postgres-test:
    name: PostgreSQL integration tests (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Actions 는 CI=true 를 기본 설정하므로 Docker가 없으면 건너뛰지 않고 실패한다(PostgresTestServer).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # build.gradle toolchain(17)에 맞춘다.
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # 기본은 main 에서만 캐시를 쓰므로 dev 도 쓰기 허용
          cache-read-only: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/main"]'), github.ref) }}
      - name: Docker info
        run: docker version
      - name: PostgreSQL tests
        run: ./gradlew postgresTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-postgres-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          retention-days: 7
