name: Web CI

# 운영 배포는 Vercel이 저장소를 직접 빌드한다(web/vercel.json). 이 워크플로는 테스트·빌드 검증만 한다.
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  push:
    # main 은 deploy.yml 이 배포 대상만 골라 이 워크플로를 workflow_call 로 호출한다(중복 실행 방지)
    branches: [dev]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:
  # deploy.yml 의 검증 잡에서 호출한다.
  workflow_call:

permissions:
  contents: read

# 같은 브랜치/PR의 이전 실행은 취소한다.
# 다른 워크플로가 호출하면 github.workflow 는 호출자 이름이 되므로 워크플로마다 접두사를 따로 둔다.
# main 은 취소하지 않는다: 취소되면 그 실행의 배포가 빠지고 다음 실행의 변경 감지(event.before 기준)에도 안 잡힌다.
concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: web

jobs:
  test:
    name: Test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build
        # 자리표시 API 주소로 프로덕션 빌드(타입 체크·CSP 주입)가 되는지만 확인한다. 실제 값은 Vercel 환경변수.
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com
