name: Deploy

# main 에 머지된 변경 중 대상(backend / hono / web)별로 마지막 성공 배포 이후 바뀐 것만 검증 후 배포한다.
# 배포 구조와 시크릿 설정은 docs/deploy.md 참고.
on:
  push:
    branches: [main]
  schedule:
    # 매주 월요일 03:00 KST (일요일 18:00 UTC). 전 대상을 검증만 하고 배포하지 않는다.
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      targets:
        description: '대상 (배포 시 변경 감지를 생략하고 선택한 대상을 전부 처리한다)'
        type: choice
        options: [all, backend, hono, web]
        default: all
      verify_only:
        description: '검증만 실행하고 배포하지 않는다'
        type: boolean
        default: false

# 기본 권한은 읽기 전용이다. 태그 갱신만 별도 잡(record)에서 contents: write 를 쓴다.
permissions:
  contents: read

# 배포는 한 번에 하나만 진행한다. 취소하지 않는다(진행 중인 배포를 끊으면 상태가 애매해진다).
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Vercel CLI 는 정확한 버전으로 고정한다. 올릴 때는 npm 게시 후 2주 이상 지난 버전을 고른다.
  VERCEL_CLI_VERSION: '62.5.0'

jobs:
  # 1) 변경 감지: 검증 대상과 배포 대상을 정한다.
  changes:
    name: 변경 감지
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      verify_backend: ${{ steps.detect.outputs.verify_backend }}
      verify_hono: ${{ steps.detect.outputs.verify_hono }}
      verify_web: ${{ steps.detect.outputs.verify_web }}
      deploy_backend: ${{ steps.detect.outputs.deploy_backend }}
      deploy_hono: ${{ steps.detect.outputs.deploy_hono }}
      deploy_web: ${{ steps.detect.outputs.deploy_web }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 대상별 마지막 성공 배포 태그(deployed/*)와 event.before 를 diff 하려면 전체 히스토리와 태그가 필요하다.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: 대상 감지
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_FULL: ${{ github.ref }}
          TARGETS: ${{ inputs.targets }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # 검증·배포는 main 에서만 한다. 다른 브랜치에서 수동 실행해도 동작하지 않는다.
          if [ "$REF_FULL" != "refs/heads/main" ]; then
            echo "::error title=main 이 아닌 ref::검증·배포는 main 에서만 실행합니다(현재: $REF_FULL)."
            exit 1
          fi

          # 대상별 앱 경로 규칙. backend/ 아래 schema.sql·messages 는 Spring 과 Hono 가 함께 쓰므로 Hono 에도 넣는다.
          RE_BACKEND='^backend/'
          RE_HONO='^(hono-server/|backend/db/schema\.sql$|backend/src/main/resources/messages[^/]*\.properties$)'
          RE_WEB='^web/'

          v_b=false; v_h=false; v_w=false
          d_b=false; d_h=false; d_w=false
          reasons=()
          sel_b=false; sel_h=false; sel_w=false

          select_targets() {
            case "$TARGETS" in
              all) sel_b=true; sel_h=true; sel_w=true ;;
              backend) sel_b=true ;;
              hono) sel_h=true ;;
              web) sel_w=true ;;
              *) echo "::error::알 수 없는 대상: $TARGETS"; exit 1 ;;
            esac
          }

          # 대상의 마지막 성공 배포 태그 이후 바뀐 파일에 앱 경로가 있으면 배포가 필요하다.
          # 태그가 없으면(처음 배포하거나 태그가 지워진 경우) 전체를 배포한다.
          needs_deploy() {
            local target="$1" re="$2" base files
            if ! git rev-parse -q --verify "refs/tags/deployed/$target" >/dev/null; then
              reasons+=("$target: 배포 태그 없음 → 전체 배포")
              return 0
            fi
            base=$(git rev-list -n 1 "refs/tags/deployed/$target")
            files=$(git diff --no-renames --name-only "$base" "$AFTER")
            if grep -Eq "$re" <<< "$files"; then
              reasons+=("$target: ${base:0:7} 이후 변경")
              return 0
            fi
            return 1
          }

          case "$EVENT_NAME" in
            schedule)
              v_b=true; v_h=true; v_w=true
              mode="주간 검증(배포 없음)"
              ;;
            workflow_dispatch)
              select_targets
              if [ "$VERIFY_ONLY" = "true" ]; then
                mode="수동 검증(배포 없음): $TARGETS"
                v_b=$sel_b; v_h=$sel_h; v_w=$sel_w
              else
                mode="수동 배포(변경 감지 생략): $TARGETS"
                d_b=$sel_b; d_h=$sel_h; d_w=$sel_w
              fi
              ;;
            *)
              mode="push ${BEFORE:0:7}..${AFTER:0:7}"
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
                || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                v_b=true; v_h=true; v_w=true
                reasons+=("직전 커밋 없음 → 검증 전체")
              else
                pushed=$(git diff --no-renames --name-only "$BEFORE" "$AFTER")
                # 배포 워크플로나 CI 워크플로가 바뀌면 해당 검증을 다시 돌린다(배포는 하지 않는다).
                if grep -Fxq '.github/workflows/deploy.yml' <<< "$pushed"; then v_b=true; v_h=true; v_w=true; fi
                if grep -Fxq '.github/workflows/backend-ci.yml' <<< "$pushed"; then v_b=true; fi
                if grep -Fxq '.github/workflows/hono-ci.yml' <<< "$pushed"; then v_h=true; fi
                if grep -Fxq '.github/workflows/web-ci.yml' <<< "$pushed"; then v_w=true; fi
              fi
              if needs_deploy backend "$RE_BACKEND"; then d_b=true; fi
              if needs_deploy hono "$RE_HONO"; then d_h=true; fi
              if needs_deploy web "$RE_WEB"; then d_w=true; fi
              ;;
          esac

          # 배포하는 대상은 반드시 검증한다.
          if [ "$d_b" = true ]; then v_b=true; fi
          if [ "$d_h" = true ]; then v_h=true; fi
          if [ "$d_w" = true ]; then v_w=true; fi

          reason="$mode"
          for r in "${reasons[@]}"; do reason="$reason / $r"; done

          {
            echo "verify_backend=$v_b"
            echo "verify_hono=$v_h"
            echo "verify_web=$v_w"
            echo "deploy_backend=$d_b"
            echo "deploy_hono=$d_h"
            echo "deploy_web=$d_w"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## 변경 감지"
            echo ""
            echo "- 기준: $reason"
            echo "- 검증: backend=$v_b, hono=$v_h, web=$v_w"
            echo "- 배포: backend=$d_b, hono=$d_h, web=$d_w"
          } >> "$GITHUB_STEP_SUMMARY"

  # 2) 검증: 대상에 해당하는 기존 CI 워크플로를 그대로 호출한다. main 은 push 로 따로 돌리지 않는다.
  verify-backend:
    name: 검증 · backend
    needs: changes
    if: needs.changes.outputs.verify_backend == 'true'
    uses: ./.github/workflows/backend-ci.yml

  verify-hono:
    name: 검증 · hono
    needs: changes
    if: needs.changes.outputs.verify_hono == 'true'
    uses: ./.github/workflows/hono-ci.yml

  verify-web:
    name: 검증 · web
    needs: changes
    if: needs.changes.outputs.verify_web == 'true'
    uses: ./.github/workflows/web-ci.yml

  # 3) 배포: 검증이 성공한 대상만 배포한다. 시크릿은 production 환경 시크릿이므로 environment 를 지정한다.
  deploy-backend:
    name: 배포 · Render backend (wellness-game-api)
    needs: [changes, verify-backend]
    if: needs.changes.outputs.deploy_backend == 'true' && needs.verify-backend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: https://wellness-game-api.onrender.com
    permissions:
      contents: read
    env:
      RENDER_API_URL: https://wellness-game-api.onrender.com
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID_API }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: 필수 시크릿·변수 확인
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error title=시크릿 누락::production 환경에 RENDER_DEPLOY_HOOK_API 시크릿이 없습니다. docs/deploy.md 'GitHub 시크릿·변수'를 보세요."
            missing=1
          fi
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::error title=시크릿 누락::production 환경에 RENDER_API_KEY 시크릿이 없습니다. 배포 완료 확인에 필요합니다(docs/deploy.md)."
            missing=1
          fi
          if [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::error title=변수 누락::RENDER_SERVICE_ID_API 변수가 없습니다(docs/deploy.md)."
            missing=1
          fi
          exit "$missing"
      - name: Render 배포 훅 호출 (검증된 커밋 고정)
        run: |
          set -euo pipefail
          # 훅은 기본적으로 main 최신 커밋을 배포한다. ref 를 붙여 이 실행이 검증한 커밋($GITHUB_SHA)을 배포한다.
          ref=$(jq -rn --arg v "$GITHUB_SHA" '$v|@uri')
          case "$RENDER_DEPLOY_HOOK" in
            *\?*) sep='&' ;;
            *) sep='?' ;;
          esac
          body="$RUNNER_TEMP/render-hook.json"
          code=$(curl -sS --max-time 30 -o "$body" -w '%{http_code}' \
            -X POST "${RENDER_DEPLOY_HOOK}${sep}ref=${ref}") \
            || { echo "::error::배포 훅 호출에 실패했습니다(네트워크 오류)."; exit 1; }
          case "$code" in
            2*) ;;
            *) echo "::error::배포 훅 응답이 HTTP $code 입니다. 훅 URL 을 다시 복사했는지 확인하세요."; exit 1 ;;
          esac
          deploy_id=$(jq -r '.deploy.id // .id // empty' "$body")
          if [ -z "$deploy_id" ]; then
            echo "::error::훅 응답에서 배포 ID 를 찾지 못했습니다."
            exit 1
          fi
          echo "RENDER_DEPLOY_ID=$deploy_id" >> "$GITHUB_ENV"
          echo "Render 배포 요청: $deploy_id (커밋 $GITHUB_SHA)"
      - name: Render 배포 live 대기
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1200 ))
          while :; do
            if [ "$(date +%s)" -gt "$deadline" ]; then
              echo "::error::20분 안에 배포가 live 가 되지 않았습니다. Render 대시보드의 Deploys 탭을 확인하세요."
              exit 1
            fi
            json=$(curl -fsS --max-time 30 --retry 3 --retry-all-errors \
              -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$RENDER_DEPLOY_ID") || json='{}'
            status=$(jq -r '.status // .deploy.status // empty' <<< "$json")
            case "$status" in
              live)
                echo "Render 배포 live: $RENDER_DEPLOY_ID"
                break ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render 배포 실패: $RENDER_DEPLOY_ID ($status)"
                exit 1 ;;
              *)
                echo "배포 진행 중: ${status:-상태 확인 중}" ;;
            esac
            sleep 15
          done
      - name: 헬스체크 (무료 플랜 콜드 스타트 재시도)
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            body=$(curl -sS --max-time 30 --retry 3 --retry-all-errors "$RENDER_API_URL/healthz" || true)
            if grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"' <<< "$body"; then
              echo "healthz OK (시도 $i)"
              exit 0
            fi
            echo "healthz 아직 응답 없음 (시도 $i). 20초 뒤 재시도"
            sleep 20
          done
          echo "::error::healthz 가 응답하지 않습니다: $RENDER_API_URL/healthz"
          exit 1
      - name: 배포 결과 요약
        if: always()
        run: |
          {
            echo "## 배포 결과 · Render backend"
            echo "- 상태: ${{ job.status }}"
            echo "- 커밋: $GITHUB_SHA"
            echo "- 서비스: wellness-game-api ($RENDER_API_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-hono:
    name: 배포 · Render hono (wellness-game-hono)
    needs: [changes, verify-hono]
    if: needs.changes.outputs.deploy_hono == 'true' && needs.verify-hono.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: https://wellness-game-hono.onrender.com
    permissions:
      contents: read
    env:
      RENDER_API_URL: https://wellness-game-hono.onrender.com
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_HONO }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID_HONO }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: 필수 시크릿·변수 확인
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error title=시크릿 누락::production 환경에 RENDER_DEPLOY_HOOK_HONO 시크릿이 없습니다. docs/deploy.md 'GitHub 시크릿·변수'를 보세요."
            missing=1
          fi
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::error title=시크릿 누락::production 환경에 RENDER_API_KEY 시크릿이 없습니다. 배포 완료 확인에 필요합니다(docs/deploy.md)."
            missing=1
          fi
          if [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::error title=변수 누락::RENDER_SERVICE_ID_HONO 변수가 없습니다(docs/deploy.md)."
            missing=1
          fi
          exit "$missing"
      - name: Render 배포 훅 호출 (검증된 커밋 고정)
        run: |
          set -euo pipefail
          ref=$(jq -rn --arg v "$GITHUB_SHA" '$v|@uri')
          case "$RENDER_DEPLOY_HOOK" in
            *\?*) sep='&' ;;
            *) sep='?' ;;
          esac
          body="$RUNNER_TEMP/render-hook.json"
          code=$(curl -sS --max-time 30 -o "$body" -w '%{http_code}' \
            -X POST "${RENDER_DEPLOY_HOOK}${sep}ref=${ref}") \
            || { echo "::error::배포 훅 호출에 실패했습니다(네트워크 오류)."; exit 1; }
          case "$code" in
            2*) ;;
            *) echo "::error::배포 훅 응답이 HTTP $code 입니다. 훅 URL 을 다시 복사했는지 확인하세요."; exit 1 ;;
          esac
          deploy_id=$(jq -r '.deploy.id // .id // empty' "$body")
          if [ -z "$deploy_id" ]; then
            echo "::error::훅 응답에서 배포 ID 를 찾지 못했습니다."
            exit 1
          fi
          echo "RENDER_DEPLOY_ID=$deploy_id" >> "$GITHUB_ENV"
          echo "Render 배포 요청: $deploy_id (커밋 $GITHUB_SHA)"
      - name: Render 배포 live 대기
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1200 ))
          while :; do
            if [ "$(date +%s)" -gt "$deadline" ]; then
              echo "::error::20분 안에 배포가 live 가 되지 않았습니다. Render 대시보드의 Deploys 탭을 확인하세요."
              exit 1
            fi
            json=$(curl -fsS --max-time 30 --retry 3 --retry-all-errors \
              -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$RENDER_DEPLOY_ID") || json='{}'
            status=$(jq -r '.status // .deploy.status // empty' <<< "$json")
            case "$status" in
              live)
                echo "Render 배포 live: $RENDER_DEPLOY_ID"
                break ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render 배포 실패: $RENDER_DEPLOY_ID ($status)"
                exit 1 ;;
              *)
                echo "배포 진행 중: ${status:-상태 확인 중}" ;;
            esac
            sleep 15
          done
      - name: 헬스체크 (무료 플랜 콜드 스타트 재시도)
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            body=$(curl -sS --max-time 30 --retry 3 --retry-all-errors "$RENDER_API_URL/healthz" || true)
            if grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"' <<< "$body"; then
              echo "healthz OK (시도 $i)"
              exit 0
            fi
            echo "healthz 아직 응답 없음 (시도 $i). 20초 뒤 재시도"
            sleep 20
          done
          echo "::error::healthz 가 응답하지 않습니다: $RENDER_API_URL/healthz"
          exit 1
      - name: 배포 결과 요약
        if: always()
        run: |
          {
            echo "## 배포 결과 · Render hono"
            echo "- 상태: ${{ job.status }}"
            echo "- 커밋: $GITHUB_SHA"
            echo "- 서비스: wellness-game-hono ($RENDER_API_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-web:
    name: 배포 · Vercel web
    needs: [changes, verify-web]
    if: needs.changes.outputs.deploy_web == 'true' && needs.verify-web.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://wellness-game-kohl.vercel.app
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_PRODUCTION_URL: https://wellness-game-kohl.vercel.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 필수 시크릿·변수 확인
        env:
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          set -euo pipefail
          missing=0
          if [ "$HAS_VERCEL_TOKEN" != "true" ]; then
            echo "::error title=시크릿 누락::production 환경에 VERCEL_TOKEN 시크릿이 없습니다. docs/deploy.md 'GitHub 시크릿·변수'를 보세요."
            missing=1
          fi
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error title=변수 누락::VERCEL_ORG_ID 변수가 없습니다(docs/deploy.md)."
            missing=1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error title=변수 누락::VERCEL_PROJECT_ID 변수가 없습니다(docs/deploy.md)."
            missing=1
          fi
          exit "$missing"
      - name: Node.js 설정
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Vercel CLI 설치 (버전 고정, 설치 스크립트 미실행)
        run: npm install --global --ignore-scripts --no-audit --no-fund "vercel@${VERCEL_CLI_VERSION}"
      # Vercel 프로젝트의 Root Directory 는 web 이다. 저장소 루트에서 실행해야 CLI 가 Root Directory 를 적용해
      # web/ 에서 빌드하고 .vercel/output 을 만든다.
      - name: 프로덕션 환경 설정 가져오기
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production
      # 빌드 단계에는 토큰을 주지 않는다. pull 이 만든 .vercel 설정으로 빌드한다.
      - name: 프로덕션 빌드 (prebuilt)
        run: vercel build --prod
      - name: 배포
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url=$(vercel deploy --prebuilt --prod)
          echo "배포 URL: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: 스모크 테스트 (운영 도메인 / 와 /privacy)
        run: |
          set -euo pipefail
          check() {
            for i in $(seq 1 5); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 --retry-all-errors "$VERCEL_PRODUCTION_URL$1" || true)
              if [ "$code" = "200" ]; then
                echo "$1 -> 200 (시도 $i)"
                return 0
              fi
              echo "$1 -> $code (시도 $i). 10초 뒤 재시도"
              sleep 10
            done
            return 1
          }
          check "/" || { echo "::error::/ 가 200 이 아닙니다."; exit 1; }
          check "/privacy" || { echo "::error::/privacy 가 200 이 아닙니다."; exit 1; }
      - name: 배포 결과 요약
        if: always()
        run: |
          {
            echo "## 배포 결과 · Vercel web"
            echo "- 상태: ${{ job.status }}"
            echo "- 커밋: $GITHUB_SHA"
            echo "- 주소: $VERCEL_PRODUCTION_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  # 4) 배포 태그: 스모크 테스트까지 통과한 대상만 deployed/<대상> 태그를 해당 커밋으로 강제 갱신한다.
  #    태그 쓰기 권한은 이 잡에만 준다(contents: write). 배포 잡들은 읽기 권한만 쓴다.
  record:
    name: 배포 태그 갱신
    needs: [changes, deploy-backend, deploy-hono, deploy-web]
    if: ${{ !cancelled() && (needs.deploy-backend.result == 'success' || needs.deploy-hono.result == 'success' || needs.deploy-web.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: backend 태그
        if: ${{ needs.deploy-backend.result == 'success' }}
        run: |
          set -euo pipefail
          git tag -f deployed/backend "$GITHUB_SHA"
          git push -f origin "refs/tags/deployed/backend"
      - name: hono 태그
        if: ${{ needs.deploy-hono.result == 'success' }}
        run: |
          set -euo pipefail
          git tag -f deployed/hono "$GITHUB_SHA"
          git push -f origin "refs/tags/deployed/hono"
      - name: web 태그
        if: ${{ needs.deploy-web.result == 'success' }}
        run: |
          set -euo pipefail
          git tag -f deployed/web "$GITHUB_SHA"
          git push -f origin "refs/tags/deployed/web"

  # 5) 결과 요약: 취소되거나 실패한 검증·배포·태그가 있으면 이 잡도 실패한다. 건너뜀(skipped)은 정상이다.
  report:
    name: 결과 요약
    needs: [changes, verify-backend, verify-hono, verify-web, deploy-backend, deploy-hono, deploy-web, record]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      REASON: ${{ needs.changes.outputs.reason }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      VERIFY_BACKEND: ${{ needs.verify-backend.result }}
      VERIFY_HONO: ${{ needs.verify-hono.result }}
      VERIFY_WEB: ${{ needs.verify-web.result }}
      DEPLOY_BACKEND: ${{ needs.deploy-backend.result }}
      DEPLOY_HONO: ${{ needs.deploy-hono.result }}
      DEPLOY_WEB: ${{ needs.deploy-web.result }}
      RECORD_RESULT: ${{ needs.record.result }}
    steps:
      - name: 결과 요약 작성 및 실패 판정
        run: |
          set -euo pipefail
          {
            echo "## 배포 파이프라인 결과"
            echo ""
            echo "기준: $REASON"
            echo ""
            echo "| 항목 | 검증 | 배포 |"
            echo "|---|---|---|"
            echo "| backend (Render wellness-game-api) | $VERIFY_BACKEND | $DEPLOY_BACKEND |"
            echo "| hono (Render wellness-game-hono) | $VERIFY_HONO | $DEPLOY_HONO |"
            echo "| web (Vercel) | $VERIFY_WEB | $DEPLOY_WEB |"
            echo ""
            echo "- 변경 감지: $CHANGES_RESULT"
            echo "- 배포 태그 갱신: $RECORD_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for r in "$CHANGES_RESULT" "$VERIFY_BACKEND" "$VERIFY_HONO" "$VERIFY_WEB" "$DEPLOY_BACKEND" "$DEPLOY_HONO" "$DEPLOY_WEB" "$RECORD_RESULT"; do
            case "$r" in
              failure|cancelled) failed=1 ;;
            esac
          done
          if [ "$failed" = 1 ]; then
            echo "::error::실패하거나 취소된 작업이 있습니다. 위 요약과 각 작업 로그를 확인하세요."
            exit 1
          fi
