name: Deploy web to GitHub Pages

on:
  push:
    branches: [dev]
    paths:
      - 'web/**'
      - '.github/workflows/web-pages.yml'
  workflow_dispatch:

# 빌드 잡(npm ci로 서드파티 코드 실행)에는 읽기 권한만 준다. Pages 쓰기·OIDC는 deploy 잡에만.
permissions:
  contents: read

# 진행 중인 배포는 끊지 않고, 대기 중인 실행만 최신 것으로 대체한다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build
        # Pages 하위 경로(https://<owner>.github.io/<repo>/)를 base로 쓴다. 커스텀 도메인이면 base_path가 비어 '/'가 된다.
        run: npm run build -- --base=${{ steps.pages.outputs.base_path }}/
        env:
          # 저장소 Variables에 설정하면 반영된다. 비어 있으면 기본값(localhost)·로그인 버튼 비활성.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_KAKAO_CLIENT_ID: ${{ vars.VITE_KAKAO_CLIENT_ID }}
          VITE_NAVER_CLIENT_ID: ${{ vars.VITE_NAVER_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
